site_name: pySIPNET
site_description: Clean Python interface to the SIPNET land surface model
site_author: Andrew Roberts
site_url: https://tarps-group.github.io/pySIPNET/
repo_url: https://github.com/TARPS-group/pySIPNET
repo_name: TARPS-group/pySIPNET

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_submodules: false
            members_order: source
  - mkdocs-jupyter:
      execute: false
      include_source: true

# Rendered example notebooks ship with their outputs (execute: false above), so
# the docs build needs no SIPNET binary. Supporting data files under examples/
# are not standalone pages.
not_in_nav: |
  /examples/data/README.md

nav:
  - Home: index.md
  - Installation: installation.md
  - SIPNET Version: sipnet-version.md
  - Design: design.md
  - User Guide:
      - Quickstart: user-guide/quickstart.md
      - Running a Model: user-guide/running-a-model.md
      - Ensemble Runs: user-guide/ensemble-runs.md
      - Reproducible Workflows: user-guide/reproducible-runs.md
      - File I/O: user-guide/file-io.md
      - Common Workflows: user-guide/workflows.md
  - Examples:
      - MCMC Calibration: examples/mcmc_calibration.ipynb
  - API Reference:
      - Overview: api/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
