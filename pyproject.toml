[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysipnet"
version = "0.1.0.dev0"
description = "Clean Python interface to the SIPNET land surface model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Roberts", email = "agr.roberts@gmail.com" }]
keywords = ["sipnet", "land surface model", "carbon cycle", "data assimilation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pint>=0.23",
    "xarray>=2023.0",
    "platformdirs>=4.0",
]

[project.scripts]
pysipnet = "pysipnet.cli:main"

[project.optional-dependencies]
viz = ["plotly>=5.3"]
examples = ["matplotlib>=3.7", "jupyter>=1.0", "nbformat>=4.2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # The build backend, also needed in the dev environment so
    # tests/test_reference.py can build a wheel offline and check that the
    # bundled Niwot reference data actually ships.
    "hatchling>=1.25",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-jupyter>=0.24",
    "xarray>=2023.0",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "nbformat>=4.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pysipnet"]
# pysipnet/bin/ holds a SIPNET binary only while a platform wheel is being
# built; the hook below force-includes it then and tags the wheel for that
# platform. Excluding it here keeps a staged binary out of the pure wheel.
exclude = ["pysipnet/bin/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N803", "N806"]  # allow camelCase for SIPNET parameter name mappings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# numpy's shipped stubs use `type` statements, which are 3.12 syntax. Analyzing
# them against our 3.11 target fails inside numpy rather than in our own code,
# so don't follow imports into them. Other third-party packages check fine.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires compiled SIPNET binary",
    "slow: takes more than a few seconds",
    "network: reaches the internet; deselected by default, run with -m network",
]
# Network tests are opt-in: the suite must pass offline and in CI without
# depending on GitHub being reachable.
addopts = "-v --tb=short -m 'not network'"

